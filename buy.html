<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>确认订单 - 跨境电商专线</title>


<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    background:#070b14;

    color:#eef4ff;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;

}


body:before{

    content:"";

    position:fixed;

    inset:-30%;

    background:

    radial-gradient(
        circle at 50% 10%,
        #123b6b66,
        transparent 35%
    ),

    radial-gradient(
        circle at 85% 45%,
        #174b9b33,
        transparent 30%
    );

    pointer-events:none;

}


.box{

    position:relative;

    max-width:620px;

    margin:auto;

    padding:55px 20px 70px;

}


.back{

    color:#78bfff;

    text-decoration:none;

    font-size:14px;

}


.title{

    text-align:center;

    margin:35px 0;

}


.title h1{

    font-size:32px;

    margin:0 0 10px;

}


.title p{

    color:#8e9bad;

    margin:0;

}


.order{

    background:

    linear-gradient(
        145deg,
        #111a29,
        #0d1420
    );

    border:1px solid #28384d;

    border-radius:25px;

    padding:30px;

    box-shadow:
    0 20px 60px #0005;

}


.row{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

    padding:15px 0;

    border-bottom:
    1px solid #243143;

    color:#aab6c7;

}


.row strong{

    color:#fff;

    text-align:right;

}


.total{

    font-size:30px;

    color:#49b7ff;

    font-weight:800;

    margin:24px 0;


}


.total small{

    color:#7d899b;

    font-size:13px;

    font-weight:400;

}


label{

    display:block;

    margin:16px 0 8px;

    color:#dce4ef;

    font-size:14px;

}


.required{

    color:#55b5ff;

}


input{

    width:100%;

    padding:15px;

    border:1px solid #304057;

    border-radius:12px;

    background:#0a111d;

    color:#fff;

    font-size:15px;

    outline:none;

}


input:focus{

    border-color:#3189d8;

    box-shadow:
    0 0 0 3px #3189d822;

}


.email-tip{

    margin-top:8px;

    color:#718097;

    font-size:12px;

    line-height:1.6;

}


.pay-title{

    margin-top:25px;

    margin-bottom:10px;

    font-size:14px;

    color:#dce4ef;

}


.pay-method{

    display:flex;

    align-items:center;

    gap:12px;

    padding:15px;

    border:1px solid #315a7f;

    border-radius:13px;

    background:#0c1725;

}


.pay-icon{

    width:38px;

    height:38px;

    border-radius:10px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#1677ff;

    color:white;

    font-weight:800;

}


.pay-name{

    font-size:15px;

    font-weight:700;

}


.pay-desc{

    margin-top:3px;

    font-size:12px;

    color:#7f8da1;

}


button{

    width:100%;

    margin-top:22px;

    padding:15px;

    border:0;

    border-radius:13px;

    background:#187ee0;

    color:#fff;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

}


button:hover{

    filter:brightness(1.12);

}


.support{

    margin-top:22px;

    padding:15px 14px;

    border:1px solid #28415d;

    border-radius:12px;

    background:#0b1421;

    text-align:center;

    color:#aab6c7;

    font-size:13px;

}


.support a{

    color:#55b5ff;

    text-decoration:none;

    font-weight:700;

}


.tip{

    text-align:center;

    color:#748197;

    font-size:12px;

    line-height:1.7;

    margin-top:18px;

}


@media(max-width:600px){

    .box{

        padding-top:35px;

    }


    .order{

        padding:24px;

        border-radius:22px;

    }


    .title h1{

        font-size:29px;

    }


    .row{

        font-size:14px;

    }

}

</style>

</head>


<body>


<div class="box">


<a
class="back"
href="index.html"
>
← 返回套餐
</a>


<div class="title">

<h1>
确认订单
</h1>

<p>
跨境电商专线
</p>

</div>


<div class="order">


<!-- 套餐 -->

<div class="row">

<span>
套餐
</span>

<strong id="name">
-
</strong>

</div>


<!-- 流量 -->

<div class="row">

<span>
流量
</span>

<strong id="traffic">
-
</strong>

</div>


<!-- 有效期 -->

<div class="row">

<span>
有效期
</span>

<strong id="duration">
-
</strong>

</div>


<!-- 价格 -->

<div class="total">

¥<span id="price">
0
</span>

<small>
应付金额
</small>

</div>


<!-- 邮箱 -->

<label>

接收邮箱

<span class="required">
*
</span>

</label>


<input
id="email"
type="email"
placeholder="请输入接收邮箱（必填）"
autocomplete="email"
>


<div class="email-tip">

下单请填写接收邮箱，邮箱用于接收订单信息，
填写后才能支付。

</div>


<!-- 支付方式 -->

<div class="pay-title">

支付方式

</div>


<div class="pay-method">

<div class="pay-icon">
支
</div>

<div>

<div class="pay-name">
支付宝支付
</div>

<div class="pay-desc">
支持支付宝扫码或跳转支付
</div>

</div>

</div>


<!-- 支付 -->

<button
onclick="goPay()"
>

立即支付

</button>


<!-- 联系客服 -->

<div class="support">

如遇问题联系

<a
href="https://t.me/kio_037"
target="_blank"
rel="noopener"
>
@kio_037
</a>

</div>


<div class="tip">

请确认套餐、价格和接收邮箱无误后再进行支付。

</div>


</div>

</div>


<script>


/*
读取首页传过来的套餐信息
*/

const p =
new URLSearchParams(
location.search
);


document.getElementById(
"name"
).textContent =
p.get("name") ||
"未选择套餐";


document.getElementById(
"price"
).textContent =
p.get("price") ||
"0";


document.getElementById(
"traffic"
).textContent =
p.get("traffic") ||
"-";


document.getElementById(
"duration"
).textContent =
p.get("duration") ||
"-";


/*
点击支付
*/

function goPay(){

    const email =
    document
    .getElementById("email")
    .value
    .trim();


    /*
    邮箱不能为空
    */

    if(!email){

        alert(
        "请先填写接收邮箱"
        );

        document
        .getElementById("email")
        .focus();

        return;

    }


    /*
    简单检查邮箱格式
    */

    const emailReg =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if(!emailReg.test(email)){

        alert(
        "请输入正确的邮箱地址"
        );

        document
        .getElementById("email")
        .focus();

        return;

    }


    /*
    获取当前套餐对应的支付宝链接
    */

    const pay =
    p.get("pay");


    if(!pay){

        alert(
        "暂未配置支付链接，请联系客服"
        );

        return;

    }


    /*
    跳转支付宝
    */

    window.location.href =
    pay;

}

</script>


</body>

</html>
